<!doctype html>
<html lang="de-CH" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio • Karriere</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="progress" class="progress"></div>

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html"><span class="dot"></span><span>Mein Portfolio</span></a>
      <nav class="nav-links" aria-label="Navigation">
        <a data-nav href="index.html">Home</a>
        <a data-nav href="about.html">Über mich</a>
        <a data-nav href="hobbies.html">Hobbys</a>
        <a data-nav href="career.html">Karriere</a>
      </nav>
      <div class="nav-actions">
        <button class="btn" type="button" onclick="toggleTheme()">🌗 <span>Theme</span></button>
      </div>
    </div>
  </header>



  <main class="container">
    <section class="hero">
      <div class="card">
        <div class="card-pad">
          <h1>Karriere</h1>

          <div class="filters" id="careerRoot">
            <input class="input" id="q" placeholder="Suche (Titel, Firma…)" />
            <select class="select" id="type">
              <option value="all">Alle</option>
              <option value="job">Job</option>
              <option value="education">Education</option>
              <option value="project">Project</option>
            </select>
            <select class="select" id="sort">
              <option value="newest">Neueste zuerst</option>
              <option value="oldest">Älteste zuerst</option>
            </select>
          </div>

          <div id="timeline" class="timeline"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <canvas id="careerChart"></canvas>
    </section>

    
  </main>

  

  <button id="toTop" class="btn to-top" type="button">↑ Top</button>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/app.js"></script>
  <script>const _y = document.getElementById("y"); if(_y) _y.textContent = new Date().getFullYear();</script>
</body>
</html>
